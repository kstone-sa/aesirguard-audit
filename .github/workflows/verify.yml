name: Shared verification
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      retain-packages:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Prepare independent schema validator
        run: |
          python3 -m venv "${RUNNER_TEMP}/schema-validation"
          "${RUNNER_TEMP}/schema-validation/bin/pip" install 'jsonschema==4.26.0'
          echo "${RUNNER_TEMP}/schema-validation/bin" >> "$GITHUB_PATH"
      - name: Install pinned vulnerability checker
        run: |
          GOBIN="${RUNNER_TEMP}/aesirguard-audit-devtools" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "${RUNNER_TEMP}/aesirguard-audit-devtools" >> "$GITHUB_PATH"
      - name: Run every main and tagged-release gate
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/verify-all.sh "$PACKAGE_VERSION" "$(git rev-parse HEAD)" \
            "$(git show -s --format=%ct HEAD)" "${RUNNER_TEMP}/aesirguard-audit-dist"
      - name: Retain verified release packages
        if: inputs.retain-packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-packages
          path: ${{ runner.temp }}/aesirguard-audit-dist/*
          if-no-files-found: error
          retention-days: 7
