name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag to publish (for example v0.10.0)
        required: true
        type: string
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.release.outputs.version }}
      create_tag: ${{ steps.release.outputs.create_tag }}
    steps:
      - id: release
        name: Validate release request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must be dispatched from main"
              exit 1
            fi
            version="$INPUT_VERSION"
            create_tag=true
          else
            version="$REF_NAME"
            create_tag=false
          fi

          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release version must be a full semantic version tag such as v0.10.0"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      retain-packages: true

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-packages
          path: dist
      - name: Check transferred archives
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Create verified annotated tag
        if: needs.prepare.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi

          tag_object_sha="$(gh api --method POST "repos/$REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="AesirGuard Audit $RELEASE_TAG" \
            -f object="$SOURCE_SHA" \
            -f type=commit \
            --jq .sha)"

          gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object_sha" >/dev/null
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$RELEASE_TAG" in
            v0.*) prerelease=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"
