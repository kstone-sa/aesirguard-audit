name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ github.ref_name }}
      retain-packages: true
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-packages
          path: dist
      - name: Check transferred archives
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --verify-tag --generate-notes
