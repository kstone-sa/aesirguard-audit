name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted_files="$(gofmt -l .)"
          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            gofmt -d $unformatted_files
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Build release targets
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=ci -X main.commit=${GITHUB_SHA} -X main.buildDate=ci" \
              -o "${RUNNER_TEMP}/audit2json-${arch}" ./cmd/audit2json
          done

  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz record parser
        run: go test ./internal/audit -run '^$' -fuzz '^FuzzParseRecordDoesNotPanic$' -fuzztime=5s
      - name: Fuzz event assembler
        run: go test ./internal/audit -run '^$' -fuzz '^FuzzAssemblerPreservesAcceptedRecords$' -fuzztime=5s
      - name: Exercise pipeline benchmark
        run: go test ./internal/audit -run '^$' -bench '^BenchmarkAuditPipeline$' -benchtime=200ms -benchmem
