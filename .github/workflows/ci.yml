name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted_files="$(gofmt -l .)"
          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            gofmt -d $unformatted_files
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Build and inspect release packages
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/audit2json-dist"
          restrictive_dist="${RUNNER_TEMP}/audit2json-dist-restrictive-umask"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          ./scripts/package-release.sh ci "${GITHUB_SHA}" "${source_date_epoch}" "$dist"
          (umask 077 && ./scripts/package-release.sh ci "${GITHUB_SHA}" "${source_date_epoch}" "$restrictive_dist")
          cmp "$dist/SHA256SUMS" "$restrictive_dist/SHA256SUMS"
          test "$(find "$dist" -maxdepth 1 -name '*_standalone.tar.gz' | wc -l)" -eq 2
          test "$(find "$dist" -maxdepth 1 -name '*_systemd.tar.gz' | wc -l)" -eq 2
          tar -tzf "$dist/audit2json_ci_linux_amd64_standalone.tar.gz" | grep '/audit2json$' >/dev/null
          if tar -tzf "$dist/audit2json_ci_linux_amd64_standalone.tar.gz" | grep -q '/packaging/'; then
            exit 1
          fi
          tar -tzf "$dist/audit2json_ci_linux_amd64_systemd.tar.gz" | \
            grep '/packaging/systemd/audit2json.service$' >/dev/null
          tar -xzf "$dist/audit2json_ci_linux_amd64_standalone.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/audit2json_ci_linux_amd64_standalone/audit2json" --version
          (cd "$dist" && sha256sum -c SHA256SUMS)

  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz record parser
        run: go test ./internal/audit -run '^$' -fuzz '^FuzzParseRecordDoesNotPanic$' -fuzztime=5s
      - name: Fuzz event assembler
        run: go test ./internal/audit -run '^$' -fuzz '^FuzzAssemblerPreservesAcceptedRecords$' -fuzztime=5s
      - name: Exercise pipeline benchmark
        run: go test ./internal/audit -run '^$' -bench '^BenchmarkAuditPipeline$' -benchtime=200ms -benchmem
